# CI config. To turn it on: git mv ci/tests.yml .github/workflows/tests.yml

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest
      # Every test is mocked: no Alpaca keys, no network, nothing is ever sent to a broker.
      - name: Run tests
        env:
          APCA_API_KEY_ID: ""
          APCA_API_SECRET_KEY: ""
        run: python -m pytest -q
